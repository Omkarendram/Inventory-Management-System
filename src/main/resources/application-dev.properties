# ------------------------------------------------------------------
# Development Profile (Active by default for local development)
# Uses In-Memory H2 Database in MySQL compatibility mode
# ------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:inventory_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Local mock mail configuration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# Image uploads
app.upload.dir=./uploads/images/
