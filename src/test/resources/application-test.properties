spring.application.name=inventory-management-system-test

# In-Memory H2 Database with MySQL compatibility mode for tests
spring.datasource.url=jdbc:h2:mem:inventory_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Mail configuration stub for testing
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# Notification Settings
app.notification.low-stock-recipient=test-admin@example.com

# File Upload for tests
app.upload.dir=target/test-uploads/images/
